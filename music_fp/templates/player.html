<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>music-boris</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #080808;
    --card:     #101010;
    --surface:  #181818;
    --text:     #e8e8e8;
    --muted:    #505050;
    --liked:    #22c55e;
    --disliked: #ef4444;
    --skip:     #6b7280;
    --accent:   #a855f7;
    --radius:   20px;
    --dur:      260ms;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px;
    gap: 16px;
  }

  /* ── Header ── */
  #header {
    font-size: .72rem;
    font-weight: 600;
    letter-spacing: .15em;
    text-transform: uppercase;
    color: var(--muted);
    user-select: none;
  }

  /* ── Card ── */
  #card {
    width: 100%;
    max-width: 480px;
    background: var(--card);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: 0 32px 80px rgba(0,0,0,.75);
    transition: opacity var(--dur) cubic-bezier(.4,0,.2,1),
                transform var(--dur) cubic-bezier(.4,0,.2,1);
  }
  #card.out {
    opacity: 0;
    transform: scale(.96) translateY(10px);
    pointer-events: none;
  }

  /* ── YouTube player box ── */
  #player-box {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
    overflow: hidden;
  }
  /* The iframe injected by YT API must fill the box */
  #player-box > iframe {
    position: absolute !important;
    inset: 0 !important;
    width: 100% !important;
    height: 100% !important;
    border: none !important;
  }
  #no-video {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 72px;
    background: linear-gradient(135deg, #111, #0a0a22);
    transition: opacity 300ms;
  }
  #no-video.hidden { opacity: 0; pointer-events: none; }

  /* ── Track info ── */
  #track-meta {
    padding: 20px 24px 8px;
    min-height: 68px;
  }
  #artist {
    font-size: .8rem;
    font-weight: 600;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: .06em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #title {
    font-size: 1.2rem;
    font-weight: 700;
    line-height: 1.3;
    margin-top: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ── Vote buttons ── */
  #buttons {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    padding: 14px 16px 16px;
  }
  .btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    padding: 14px 6px 11px;
    border: none;
    border-radius: 14px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    transition: filter 150ms, transform 100ms;
    -webkit-tap-highlight-color: transparent;
    outline: none;
  }
  .btn:hover { filter: brightness(1.3); }
  .btn:active { transform: scale(.91); }
  .btn .icon { font-size: 1.65rem; line-height: 1; }
  .btn .label { font-size: .78rem; font-weight: 500; letter-spacing: .01em; }
  .btn kbd {
    font-size: .6rem;
    color: var(--muted);
    font-family: inherit;
    background: none;
    border: none;
    padding: 0;
  }

  #btn-dislike .icon { filter: drop-shadow(0 0 8px var(--disliked)); }
  #btn-skip    .icon { filter: drop-shadow(0 0 8px var(--skip)); }
  #btn-like    .icon { filter: drop-shadow(0 0 8px var(--liked)); }

  /* ── Footer stats ── */
  #footer {
    padding: 2px 20px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: .72rem;
    color: var(--muted);
    flex-wrap: wrap;
  }
  #footer .sep { flex: 1; }
  .stat-liked    { color: #166534; }
  .stat-disliked { color: #7f1d1d; }
  #dot-disc {
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent);
    margin-right: 4px;
    opacity: 0;
    transition: opacity 300ms;
    animation: pulse 1.5s ease-in-out infinite;
  }
  #dot-disc.active { opacity: 1; }
  @keyframes pulse {
    0%, 100% { transform: scale(.8); }
    50% { transform: scale(1.4); }
  }

  /* ── Empty state ── */
  #empty-state {
    display: none;
    width: 100%;
    max-width: 480px;
    background: var(--card);
    border-radius: var(--radius);
    padding: 52px 24px;
    text-align: center;
    box-shadow: 0 32px 80px rgba(0,0,0,.75);
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  #empty-state .icon { font-size: 52px; }
  #empty-state .main { font-size: 1rem; font-weight: 600; }
  #empty-state .sub  { font-size: .85rem; color: var(--muted); line-height: 1.6; }
</style>
</head>
<body>

<div id="header">music-boris</div>

<div id="card">
  <div id="player-box">
    <div id="yt-player"></div>
    <div id="no-video">🎵</div>
  </div>

  <div id="track-meta">
    <div id="artist"></div>
    <div id="title">Chargement…</div>
  </div>

  <div id="buttons">
    <button class="btn" id="btn-dislike" data-vote="disliked">
      <span class="icon">👎</span>
      <span class="label">Pas pour moi</span>
      <kbd>D ←</kbd>
    </button>
    <button class="btn" id="btn-skip" data-vote="skipped">
      <span class="icon">⏭</span>
      <span class="label">Passe</span>
      <kbd>espace</kbd>
    </button>
    <button class="btn" id="btn-like" data-vote="liked">
      <span class="icon">👍</span>
      <span class="label">J'aime</span>
      <kbd>L →</kbd>
    </button>
  </div>

  <div id="footer">
    <span class="stat-liked">♥ <span id="n-liked">0</span></span>
    <span class="stat-disliked">✗ <span id="n-disliked">0</span></span>
    <span>⏭ <span id="n-skipped">0</span></span>
    <span class="sep"></span>
    <span>
      <span id="dot-disc"></span><span id="n-queue">0</span> en file
    </span>
  </div>
</div>

<div id="empty-state">
  <div class="icon">🔍</div>
  <p class="main">Découverte en cours…</p>
  <p class="sub">De nouveaux morceaux arrivent bientôt.<br>Reviens dans quelques instants.</p>
</div>

<!-- YouTube IFrame API -->
<script>
(function() {
  const s = document.createElement('script');
  s.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(s);
})();
</script>

<script>
// ── State ───────────────────────────────────────────────────────────────────
const S = {
  current:   null,   // current track object from API
  voting:    false,  // lock to prevent double votes
  ytPlayer:  null,   // YT.Player instance
  ytReady:   false,  // player API ready
};

// ── YouTube IFrame API ───────────────────────────────────────────────────────
window.onYouTubeIframeAPIReady = function() {
  S.ytPlayer = new YT.Player('yt-player', {
    height: '315',
    width:  '560',
    playerVars: {
      autoplay:       1,
      rel:            0,
      modestbranding: 1,
      playsinline:    1,
      fs:             1,
      iv_load_policy: 3,
    },
    events: {
      onReady(e) {
        S.ytReady = true;
        // If a track was loaded before the player was ready, play it now
        if (S.current?.video_id) {
          e.target.loadVideoById(S.current.video_id);
          document.getElementById('no-video').classList.add('hidden');
        }
      },
    },
  });
};

function ytLoad(videoId) {
  if (!videoId) return;
  document.getElementById('no-video').classList.add('hidden');
  if (S.ytReady && S.ytPlayer) {
    S.ytPlayer.loadVideoById(videoId);
  }
  // else: onReady will call loadVideoById when it fires
}

// ── API helpers ──────────────────────────────────────────────────────────────
async function fetchCurrent() {
  const r = await fetch('/api/current');
  if (!r.ok) return null;
  const d = await r.json();
  return d.track_id ? d : null;
}

async function sendVote(trackId, vote) {
  const r = await fetch('/api/vote', {
    method:  'POST',
    headers: { 'Content-Type': 'application/json' },
    body:    JSON.stringify({ track_id: trackId, vote }),
  });
  return r.json();
}

// ── Rendering ────────────────────────────────────────────────────────────────
function renderTrack(track) {
  document.getElementById('artist').textContent = track.artist || '';
  document.getElementById('title').textContent  = track.title  || 'Titre inconnu';

  if (track.video_id) {
    ytLoad(track.video_id);
  } else {
    document.getElementById('no-video').classList.remove('hidden');
  }

  if (track.stats) updateStats(track.stats);
}

function updateStats(stats) {
  document.getElementById('n-liked').textContent    = stats.liked    ?? 0;
  document.getElementById('n-disliked').textContent = stats.disliked ?? 0;
  document.getElementById('n-skipped').textContent  = stats.skipped  ?? 0;
  document.getElementById('n-queue').textContent    = stats.queue_size ?? 0;
  document.getElementById('dot-disc').classList.toggle('active', !!stats.discovering);
}

function showCard() {
  document.getElementById('card').style.display       = '';
  document.getElementById('empty-state').style.display = 'none';
}

function showEmpty() {
  document.getElementById('card').style.display       = 'none';
  document.getElementById('empty-state').style.display = 'flex';
  setTimeout(loadCurrent, 5000);
}

// ── Load first track ─────────────────────────────────────────────────────────
async function loadCurrent() {
  try {
    const data = await fetchCurrent();
    if (data) {
      S.current = data;
      renderTrack(data);
      showCard();
    } else {
      showEmpty();
    }
  } catch {
    showEmpty();
  }
}

// ── Vote ─────────────────────────────────────────────────────────────────────
async function vote(v) {
  if (!S.current || S.voting) return;
  S.voting = true;

  const card = document.getElementById('card');

  // Animate out + fire API call in parallel
  card.classList.add('out');
  const voteP = sendVote(S.current.track_id, v).catch(() => ({}));

  // Wait for CSS transition
  await new Promise(res => setTimeout(res, 240));

  let data = {};
  try { data = await voteP; } catch {}

  if (data.next) {
    S.current = data.next;
    renderTrack(data.next);
    if (data.stats) updateStats(data.stats);
    // Brief pause before fade-in so DOM updates are painted
    await new Promise(res => setTimeout(res, 16));
    card.classList.remove('out');
    showCard();
  } else {
    card.classList.remove('out');
    if (data.stats) updateStats(data.stats);
    showEmpty();
  }

  S.voting = false;
}

// ── Keyboard shortcuts ───────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'l' || e.key === 'L' || e.key === 'ArrowRight') vote('liked');
  if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowLeft')  vote('disliked');
  if (e.key === ' ' || e.key === 'ArrowUp') { e.preventDefault(); vote('skipped'); }
});

document.querySelectorAll('.btn').forEach(btn => {
  btn.addEventListener('click', () => vote(btn.dataset.vote));
});

// ── Boot ─────────────────────────────────────────────────────────────────────
loadCurrent();
</script>
</body>
</html>
