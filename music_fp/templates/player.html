<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>music-fp</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0a;
    --surface: #141414;
    --surface2: #1e1e1e;
    --text: #f0f0f0;
    --muted: #6b7280;
    --liked: #22c55e;
    --disliked: #ef4444;
    --skip: #9ca3af;
    --accent: #8b5cf6;
    --radius: 16px;
    --transition: 280ms cubic-bezier(.4,0,.2,1);
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }

  #card {
    width: 100%;
    max-width: 400px;
    background: var(--surface);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: 0 24px 60px rgba(0,0,0,.6);
    transition: opacity var(--transition), transform var(--transition);
  }
  #card.fade-out { opacity: 0; transform: scale(.96); }

  /* Album art */
  #art-wrap {
    position: relative;
    aspect-ratio: 1;
    background: linear-gradient(135deg, var(--surface2), #0a0a2e);
    overflow: hidden;
  }
  #art {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    transition: opacity 400ms;
  }
  #art.hidden { opacity: 0; }
  #art-placeholder {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 72px;
    user-select: none;
  }

  /* Progress bar (audio) */
  #progress-wrap {
    height: 3px;
    background: var(--surface2);
    cursor: pointer;
  }
  #progress-bar {
    height: 100%;
    width: 0%;
    background: var(--accent);
    transition: width .5s linear;
  }

  /* Track info */
  #info {
    padding: 20px 24px 4px;
  }
  #track-title {
    font-size: 1.2rem;
    font-weight: 600;
    line-height: 1.3;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #track-artist {
    font-size: .9rem;
    color: var(--muted);
    margin-top: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Buttons */
  #buttons {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
    padding: 20px 24px 24px;
  }
  .vote-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 14px 8px;
    border: none;
    border-radius: 12px;
    background: var(--surface2);
    color: var(--text);
    font-size: .8rem;
    font-weight: 500;
    cursor: pointer;
    transition: background var(--transition), transform 120ms;
    -webkit-tap-highlight-color: transparent;
  }
  .vote-btn:hover { filter: brightness(1.2); }
  .vote-btn:active { transform: scale(.94); }

  #btn-liked  { --c: var(--liked); }
  #btn-dislike{ --c: var(--disliked); }
  #btn-skip   { --c: var(--skip); }

  .vote-btn .icon {
    font-size: 1.5rem;
    line-height: 1;
    filter: drop-shadow(0 0 8px var(--c, transparent));
  }
  .vote-btn .key {
    font-size: .65rem;
    color: var(--muted);
    font-weight: 400;
  }

  /* Footer stats */
  #footer {
    padding: 0 24px 18px;
    display: flex;
    justify-content: space-between;
    font-size: .72rem;
    color: var(--muted);
  }
  #footer span { display: flex; align-items: center; gap: 4px; }
  #dot-discovering {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent);
    animation: pulse 1.4s ease-in-out infinite;
    display: none;
  }
  #dot-discovering.active { display: inline-block; }
  @keyframes pulse {
    0%, 100% { opacity: .3; transform: scale(.8); }
    50% { opacity: 1; transform: scale(1.2); }
  }

  /* Empty state */
  #empty {
    display: none;
    flex-direction: column;
    align-items: center;
    padding: 48px 24px;
    gap: 12px;
    text-align: center;
  }
  #empty.visible { display: flex; }
  #empty .icon { font-size: 48px; }
  #empty p { color: var(--muted); font-size: .9rem; line-height: 1.5; }

  /* Hidden audio element */
  audio { display: none; }
</style>
</head>
<body>

<div id="card">
  <div id="art-wrap">
    <span id="art-placeholder">🎵</span>
    <img id="art" class="hidden" alt="" loading="lazy">
  </div>

  <div id="progress-wrap">
    <div id="progress-bar"></div>
  </div>

  <div id="info">
    <div id="track-title">Chargement…</div>
    <div id="track-artist"></div>
  </div>

  <div id="buttons">
    <button class="vote-btn" id="btn-dislike" data-vote="disliked">
      <span class="icon">👎</span>
      <span>Non</span>
      <span class="key">← D</span>
    </button>
    <button class="vote-btn" id="btn-skip" data-vote="skipped">
      <span class="icon">⏭</span>
      <span>Passe</span>
      <span class="key">Espace</span>
    </button>
    <button class="vote-btn" id="btn-liked" data-vote="liked">
      <span class="icon">👍</span>
      <span>J'aime</span>
      <span class="key">L →</span>
    </button>
  </div>

  <div id="footer">
    <span id="stat-votes">0 votés</span>
    <span>
      <span id="dot-discovering"></span>
      <span id="stat-queue">0 en file</span>
    </span>
  </div>

  <div id="empty">
    <span class="icon">🔍</span>
    <p>Découverte de nouveaux morceaux en cours…<br>Reviens dans quelques minutes.</p>
  </div>
</div>

<audio id="player" preload="auto"></audio>

<script>
const state = { current: null, voting: false, sessionVotes: 0 };

async function loadCurrent() {
  try {
    const r = await fetch('/api/current');
    if (!r.ok) { showEmpty(); return; }
    const data = await r.json();
    if (!data.track_id) { showEmpty(); return; }
    state.current = data;
    render(data);
  } catch { showEmpty(); }
}

async function vote(v) {
  if (!state.current || state.voting) return;
  state.voting = true;
  const trackId = state.current.track_id;

  // Animate out
  document.getElementById('card').classList.add('fade-out');

  try {
    const r = await fetch('/api/vote', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ track_id: trackId, vote: v })
    });
    const data = await r.json();
    state.sessionVotes++;

    if (data.next) {
      state.current = data.next;
      render(data.next);
      updateStats(data.stats);
    } else {
      showEmpty();
    }
  } catch { showEmpty(); }

  document.getElementById('card').classList.remove('fade-out');
  state.voting = false;
}

function render(track) {
  document.getElementById('track-title').textContent = track.title || 'Titre inconnu';
  document.getElementById('track-artist').textContent = track.artist || '';

  const art = document.getElementById('art');
  const placeholder = document.getElementById('art-placeholder');
  if (track.thumbnail_url) {
    art.onload = () => { art.classList.remove('hidden'); placeholder.style.opacity = '0'; };
    art.onerror = () => { art.classList.add('hidden'); placeholder.style.opacity = '1'; };
    art.src = track.thumbnail_url;
  } else {
    art.classList.add('hidden');
    placeholder.style.opacity = '1';
    placeholder.textContent = artistEmoji(track.artist);
  }

  // Audio
  const player = document.getElementById('player');
  player.src = `/audio/${track.track_id}`;
  player.play().catch(() => {});  // autoplay may be blocked; OK

  document.getElementById('progress-bar').style.width = '0%';
  player.ontimeupdate = () => {
    if (player.duration) {
      const pct = (player.currentTime / player.duration) * 100;
      document.getElementById('progress-bar').style.width = pct + '%';
    }
  };

  document.getElementById('empty').classList.remove('visible');
  updateStats(track.stats);
}

function updateStats(stats) {
  if (!stats) return;
  const v = stats.total_votes || state.sessionVotes;
  document.getElementById('stat-votes').textContent = v + (v === 1 ? ' voté' : ' votés');
  document.getElementById('stat-queue').textContent = (stats.queue_size || 0) + ' en file';
  const dot = document.getElementById('dot-discovering');
  dot.classList.toggle('active', !!stats.discovering);
}

function showEmpty() {
  document.getElementById('empty').classList.add('visible');
  // Poll every 5s for new candidates
  setTimeout(loadCurrent, 5000);
}

function artistEmoji(artist) {
  const emojis = ['🎵', '🎸', '🎹', '🎷', '🥁', '🎺', '🎻', '🎤'];
  if (!artist) return '🎵';
  return emojis[artist.charCodeAt(0) % emojis.length];
}

// Progress bar click → seek
document.getElementById('progress-wrap').addEventListener('click', (e) => {
  const player = document.getElementById('player');
  if (!player.duration) return;
  const rect = e.currentTarget.getBoundingClientRect();
  player.currentTime = ((e.clientX - rect.left) / rect.width) * player.duration;
});

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'l' || e.key === 'L' || e.key === 'ArrowRight') vote('liked');
  if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowLeft')  vote('disliked');
  if (e.key === ' ' || e.key === 'ArrowUp') { e.preventDefault(); vote('skipped'); }
});

// Button clicks
document.querySelectorAll('.vote-btn').forEach(btn => {
  btn.addEventListener('click', () => vote(btn.dataset.vote));
});

// Boot
loadCurrent();
</script>
</body>
</html>
